<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeepSeek Harness GenUI</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1280px; height: 720px; margin: 0; overflow: hidden; }
    body {
      position: relative;
      background:
        radial-gradient(circle at 11% 8%, rgba(229, 139, 89, .17), transparent 31%),
        radial-gradient(circle at 92% 91%, rgba(92, 153, 124, .13), transparent 30%),
        #0d100f;
      color: #f3efe7;
      font-family: "Avenir Next", "Helvetica Neue", sans-serif;
    }
    body::before {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px);
      background-size: 48px 48px;
      content: "";
      mask-image: linear-gradient(to right, black, transparent 68%);
    }
    .brand {
      position: absolute;
      z-index: 2;
      top: 46px;
      left: 50px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #ddd8cf;
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .13em;
      text-transform: uppercase;
    }
    .mark {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border-radius: 9px;
      background: #e58b59;
      color: #18130f;
      font-size: 15px;
      font-weight: 850;
      letter-spacing: 0;
    }
    .copy {
      position: absolute;
      z-index: 2;
      top: 201px;
      left: 50px;
      width: 345px;
    }
    h1 {
      margin: 0;
      color: #f5f1e9;
      font-size: 57px;
      font-weight: 620;
      letter-spacing: -.052em;
      line-height: 1.02;
      text-wrap: balance;
    }
    h1 em {
      color: #eda277;
      font-family: "Iowan Old Style", Georgia, serif;
      font-weight: 500;
    }
    .lede {
      width: 310px;
      margin: 25px 0 0;
      color: #a9aaa3;
      font-size: 16px;
      line-height: 1.55;
      text-wrap: pretty;
    }
    .screenshot {
      position: absolute;
      z-index: 2;
      top: 124px;
      right: 40px;
      display: block;
      width: 836px;
      height: 470px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 18px;
      box-shadow: 0 34px 90px rgba(0,0,0,.52);
      object-fit: cover;
    }
  </style>
</head>
<body>
  <div class="brand"><span class="mark">G</span>DeepSeek Harness GenUI</div>
  <section class="copy">
    <h1>Ask in words.<br>Decide in an <em>interface.</em></h1>
    <p class="lede">The Agent explains in chat, then opens the part worth interacting with beside it.</p>
  </section>
  <img
    class="screenshot"
    src="../screenshots/v0.10.7-calendar-canvas.jpg"
    width="1280"
    height="720"
    alt="DeepSeek Harness conversation beside a generated calendar selection interface"
  >
</body>
</html>
