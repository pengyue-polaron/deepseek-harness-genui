<!doctype html>
<html lang="en" data-language="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeepSeek Harness GenUI</title>
  <script>
    const language = new URLSearchParams(location.search).get('lang') === 'zh-CN' ? 'zh-CN' : 'en'
    document.documentElement.lang = language
    document.documentElement.dataset.language = language
  </script>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1280px; height: 720px; margin: 0; overflow: hidden; }
    body {
      position: relative;
      background:
        radial-gradient(circle at 11% 8%, rgba(229, 139, 89, .17), transparent 31%),
        radial-gradient(circle at 92% 91%, rgba(92, 153, 124, .13), transparent 30%),
        #0d100f;
      color: #f3efe7;
      font-family: "Avenir Next", "Helvetica Neue", sans-serif;
    }
    body::before {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px);
      background-size: 48px 48px;
      content: "";
      mask-image: linear-gradient(to right, black, transparent 68%);
    }
    [data-copy], [data-shot] { display: none; }
    html[data-language="en"] [data-copy="en"],
    html[data-language="en"] [data-shot="en"],
    html[data-language="zh-CN"] [data-copy="zh-CN"],
    html[data-language="zh-CN"] [data-shot="zh-CN"] { display: block; }
    .copy {
      position: absolute;
      z-index: 2;
      top: 201px;
      left: 50px;
      width: 345px;
    }
    html[data-language="zh-CN"] .copy { width: 350px; }
    h1 {
      margin: 0;
      color: #f5f1e9;
      font-size: 57px;
      font-weight: 620;
      letter-spacing: -.052em;
      line-height: 1.02;
      text-wrap: balance;
    }
    h1 em {
      color: #eda277;
      font-family: "Iowan Old Style", Georgia, serif;
      font-weight: 500;
    }
    html[data-language="zh-CN"] h1 {
      font-family: "Songti SC", "STSong", serif;
      font-size: 42px;
      font-weight: 600;
      letter-spacing: -.045em;
      line-height: 1.12;
    }
    .lede {
      width: 310px;
      margin: 25px 0 0;
      color: #a9aaa3;
      font-size: 16px;
      line-height: 1.55;
      text-wrap: pretty;
    }
    .screenshot {
      position: absolute;
      z-index: 2;
      top: 124px;
      right: 40px;
      width: 836px;
      height: 470px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 18px;
      box-shadow: 0 34px 90px rgba(0,0,0,.52);
      object-fit: cover;
    }
  </style>
</head>
<body>
  <section class="copy" data-copy="en">
    <h1>Ask in words.<br>Decide in an <em>interface.</em></h1>
    <p class="lede">The Agent keeps the answer in chat and opens the part worth interacting with.</p>
  </section>
  <section class="copy" data-copy="zh-CN">
    <h1>一句话提需求，<br>在<em>界面</em>里做决定。</h1>
    <p class="lede">回答留在对话里，适合操作的部分直接变成界面。</p>
  </section>
  <img
    class="screenshot"
    data-shot="en"
    src="../screenshots/en/code-path-inline.png"
    width="1280"
    height="720"
    alt="An interactive code-path explorer embedded in a coding conversation"
  >
  <img
    class="screenshot"
    data-shot="zh-CN"
    src="../screenshots/zh-CN/photosynthesis-inline.png"
    width="1280"
    height="720"
    alt="对话中生成的光合作用模型和下一轮状态回读"
  >
</body>
</html>
