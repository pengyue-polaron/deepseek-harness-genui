<!doctype html>
<html lang="en" data-language="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280, initial-scale=1">
  <meta name="theme-color" content="#090d11">
  <title>DeepSeek Harness GenUI</title>
  <script>
    const language = new URLSearchParams(location.search).get("lang") === "zh-CN" ? "zh-CN" : "en";
    document.documentElement.lang = language;
    document.documentElement.dataset.language = language;
  </script>
  <style>
    :root {
      color-scheme: dark;
      --ink: #090d11;
      --text: #f5f7f6;
      --muted: #9ba7ae;
      --line: rgba(211, 227, 232, .18);
      --green: #8cf3a8;
      --cyan: #79d9ee;
    }

    * { box-sizing: border-box; }
    html, body { width: 1280px; height: 720px; margin: 0; overflow: hidden; }
    body {
      position: relative;
      color: var(--text);
      background:
        radial-gradient(circle at 91% 6%, rgba(121, 217, 238, .13), transparent 28%),
        radial-gradient(circle at 5% 94%, rgba(140, 243, 168, .09), transparent 28%),
        linear-gradient(135deg, #090d11 0%, #0b1116 55%, #091015 100%);
      font-family: "Avenir Next", "PingFang SC", "Hiragino Sans GB", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(rgba(121, 217, 238, .025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(121, 217, 238, .025) 1px, transparent 1px);
      background-size: 52px 52px;
      mask-image: linear-gradient(90deg, #000, transparent 72%);
      content: "";
    }
    [data-copy], [data-shot] { display: none !important; }
    html[data-language="en"] [data-copy="en"],
    html[data-language="en"] [data-shot="en"],
    html[data-language="zh-CN"] [data-copy="zh-CN"],
    html[data-language="zh-CN"] [data-shot="zh-CN"] { display: block !important; }
    html[data-language="en"] .mode[data-copy="en"],
    html[data-language="zh-CN"] .mode[data-copy="zh-CN"] { display: flex !important; }

    .brand {
      position: absolute;
      z-index: 5;
      top: 39px;
      left: 48px;
      display: flex;
      align-items: center;
      gap: 11px;
      color: #dbe3e5;
      font-size: 15px;
      font-weight: 720;
      letter-spacing: .075em;
      text-transform: uppercase;
    }
    .mark {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: conic-gradient(var(--green) 0 78%, transparent 78%);
      -webkit-mask: radial-gradient(circle, transparent 42%, #000 46%);
      mask: radial-gradient(circle, transparent 42%, #000 46%);
    }
    .copy {
      position: absolute;
      z-index: 5;
      top: 108px;
      left: 48px;
      width: 340px;
    }
    h1 {
      margin: 0;
      max-width: 340px;
      font-size: 42px;
      font-weight: 720;
      letter-spacing: -.045em;
      line-height: 1.08;
      text-wrap: balance;
    }
    html[data-language="en"] h1 {
      font-size: 36px;
      white-space: nowrap;
    }
    html[data-language="zh-CN"] h1 {
      max-width: 340px;
      font-size: 42px;
      letter-spacing: -.035em;
      line-height: 1.14;
    }
    h1 em { color: var(--green); font-style: normal; }
    .lede {
      margin: 17px 0 0;
      max-width: 315px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.5;
    }

    .frame {
      position: absolute;
      overflow: hidden;
      margin: 0;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: #111315;
      box-shadow: 0 28px 74px rgba(0, 0, 0, .48);
    }
    .frame img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .canvas {
      z-index: 2;
      top: 68px;
      right: 34px;
      width: 854px;
      height: 480px;
    }
    .inline {
      z-index: 4;
      left: 52px;
      bottom: 18px;
      width: 790px;
      height: 377px;
      border-color: rgba(140, 243, 168, .31);
    }
    .mode {
      position: absolute;
      z-index: 6;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 30px;
      padding: 6px 11px;
      border: 1px solid rgba(255, 255, 255, .16);
      border-radius: 999px;
      background: rgba(8, 12, 15, .88);
      box-shadow: 0 8px 24px rgba(0, 0, 0, .3);
      backdrop-filter: blur(12px);
      color: #f1f5f4;
      font-size: 11px;
      font-weight: 760;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .mode::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 16px rgba(140, 243, 168, .7);
      content: "";
    }
    .mode-canvas { top: 84px; right: 50px; }
    .mode-inline { left: 68px; bottom: 331px; }
  </style>
</head>
<body>
  <div class="brand"><i class="mark" aria-hidden="true"></i><span translate="no">DeepSeek Harness GenUI</span></div>

  <section class="copy" data-copy="en">
    <h1>You act in the UI.<br>The Agent picks up<br><em>from there.</em></h1>
    <p class="lede">Code-first, inline in chat or open in Canvas.</p>
  </section>
  <section class="copy" data-copy="zh-CN">
    <h1>你在界面里操作，<br>Agent 下一轮<br><em>接着做。</em></h1>
    <p class="lede">Code-first，放在对话里，也能展开到 Canvas。</p>
  </section>

  <figure class="frame canvas">
    <img data-shot="en" src="../screenshots/en/science-canvas.jpg" width="1224" height="688" alt="A scientific explanation and interactive model open together in DeepSeek Harness Canvas">
    <img data-shot="zh-CN" src="../screenshots/zh-CN/galaxy-canvas.jpg" width="1224" height="688" alt="DeepSeek Harness 对话与右侧银河尺度交互模型">
  </figure>
  <div class="mode mode-canvas" data-copy="en">Canvas</div>
  <div class="mode mode-canvas" data-copy="zh-CN">Canvas</div>

  <figure class="frame inline">
    <img data-shot="en" src="../screenshots/en/route-planner-inline.jpg" width="1174" height="560" alt="An edited day plan and the next user turn shown inline in DeepSeek Harness">
    <img data-shot="zh-CN" src="../screenshots/zh-CN/route-planner-inline.jpg" width="1174" height="560" alt="DeepSeek Harness 对话中保存过选择的路线规划界面与下一轮提问">
  </figure>
  <div class="mode mode-inline" data-copy="en">Inline</div>
  <div class="mode mode-inline" data-copy="zh-CN">Inline</div>
</body>
</html>
